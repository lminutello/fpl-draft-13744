name: Update FPL data

# Manual only: no schedule. Run it from the Actions tab ("Run workflow"),
# or ask Claude to dispatch it. One pull per run, no polling loop - the
# old scheduled + polling setup let two runs overlap, collide on the data
# commit and fail.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpl-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch FPL Draft data
        run: python scripts/fetch_fpl.py

      - name: Commit any changes
        run: |
          git config user.name  "fpl-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -q -m "data: snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
          # If main moved while we ran, our fresh pull supersedes whatever data
          # landed meanwhile: rebase, and on a data conflict keep ours.
          if ! git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}"; then
            git rebase --abort || true
            echo "rebase failed; retrying on top of origin"
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --soft "origin/${GITHUB_REF_NAME}"
            git add -A data
            git commit -q -m "data: snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
          fi
          git push -q
