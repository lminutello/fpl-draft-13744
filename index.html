<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mr. Madueke · Draft 13744</title>
<meta name="description" content="Live table, head-to-head matchups and projections for FPL Draft league 13744.">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Draft 13744">
<meta name="theme-color" content="#0F5C3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1EE; --card:#FFFFFF; --ink:#16231C; --muted:#5E6B63; --rule:#D5DCD7; --tint:#E4EAE6;
  --brand:#0F5C3A; --brand-ink:#F4F7F2; --live:#D23B2E; --win:#13824F; --loss:#B23A3A; --draw:#8A6D1E;
  --mine:#0F5C3A;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#101613; --card:#18201C; --ink:#E7EDE9; --muted:#93A099; --rule:#2A3530; --tint:#1F2924;
  --brand:#167A4D; --brand-ink:#F4F7F2; --live:#F0594B; --win:#3DBA7C; --loss:#E06C6C; --draw:#D1B25A; --mine:#3DBA7C;
}}
:root[data-theme="dark"]{
  --paper:#101613; --card:#18201C; --ink:#E7EDE9; --muted:#93A099; --rule:#2A3530; --tint:#1F2924;
  --brand:#167A4D; --brand-ink:#F4F7F2; --live:#F0594B; --win:#3DBA7C; --loss:#E06C6C; --draw:#D1B25A; --mine:#3DBA7C;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--paper); color:var(--ink); font:15px/1.4 Archivo,system-ui,-apple-system,sans-serif;
  font-variant-numeric:tabular-nums; padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit; color:inherit}
.wrap{max-width:760px; margin:0 auto; padding:0 16px}

/* top bar */
.bar{background:var(--brand); color:var(--brand-ink); padding:calc(10px + env(safe-area-inset-top)) 0 0}
.bar .wrap{display:flex; flex-direction:column; gap:8px}
.lg{font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; opacity:.8}
.gwrow{display:flex; align-items:center; gap:6px}
.gwrow h1{margin:0; font-size:24px; font-weight:800; letter-spacing:-.01em; flex:1}
.gwrow button{background:transparent; border:0; color:inherit; width:36px; height:36px; border-radius:50%; font-size:20px; cursor:pointer}
.gwrow button:disabled{opacity:.3; cursor:default}
.gwrow button:not(:disabled):hover{background:rgba(255,255,255,.12)}
.pill{font-size:11px; font-weight:700; letter-spacing:.06em; padding:3px 8px; border-radius:99px; background:rgba(255,255,255,.16); text-transform:uppercase}
.pill.live{background:var(--live); color:#fff}
.sub{font-size:12.5px; opacity:.85; display:flex; flex-wrap:wrap; gap:4px 14px}
.tabs{display:flex; gap:4px; margin-top:4px}
.tabs a{color:inherit; text-decoration:none; font-weight:600; font-size:14px; padding:10px 14px 9px; border-bottom:3px solid transparent; opacity:.75}
.tabs a[aria-current="page"]{border-bottom-color:var(--brand-ink); opacity:1}

main.wrap{padding:16px 16px 40px}
.note{font-size:12.5px; color:var(--muted); margin:0 0 12px}
.note b{color:var(--ink); font-weight:600}

/* matchup cards */
.mlist{display:flex; flex-direction:column; gap:10px}
.mc{display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--rule); border-radius:10px;
  padding:12px 14px; cursor:pointer; text-decoration:none; color:inherit}
.mc:hover{border-color:var(--muted)}
.mc.mine{border-color:var(--mine); box-shadow:inset 3px 0 0 var(--mine)}
.mgrid{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center}
.side{min-width:0}
.side.r{text-align:right}
.tn{font-weight:700; font-size:15px; line-height:1.2; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow-wrap:anywhere}
.mn{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.score{display:flex; align-items:baseline; gap:8px; font-weight:800; font-size:28px; letter-spacing:-.02em}
.score .dash{color:var(--muted); font-weight:500; font-size:20px}
.score.pre{color:var(--muted); font-weight:600; font-size:22px}
@media (max-width:400px){ .score{font-size:24px} .dhead .score{font-size:28px} }
.meta{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; margin-top:8px; font-size:12px; color:var(--muted)}
.meta .r{text-align:right}
.wp{display:flex; height:6px; border-radius:3px; overflow:hidden; margin-top:8px; background:var(--tint)}
.wp i{display:block; height:100%}
.wp .a{background:var(--ink)} .wp .b{background:var(--muted); opacity:.45}
.res{font-weight:700}
.res.W{color:var(--win)} .res.L{color:var(--loss)} .res.D{color:var(--draw)}

/* detail */
.back{display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none; font-size:13.5px; font-weight:600; margin-bottom:10px}
.back:hover{color:var(--ink)}
.dhead{background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:14px; margin-bottom:12px}
.dhead .score{font-size:34px}

/* team switch above the pitch */
.tsw{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:0 0 10px}
.tsw button{background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:9px 12px; text-align:left; cursor:pointer; min-width:0}
.tsw button[aria-pressed="true"]{border-color:var(--brand); box-shadow:inset 0 0 0 1.5px var(--brand)}
.tsw .tn{font-size:14px}
.tsw .tv{font-size:12px; color:var(--muted); margin-top:1px}
.tsw .tv b{color:var(--ink); font-size:15px}
.ghd{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin:0 2px 6px}
.ghd b{color:var(--ink)}

/* pitch: GK at the top, as the FPL app draws it */
.pitch{position:relative; border-radius:12px 12px 0 0; overflow:hidden; padding:12px 4px 6px;
  background:repeating-linear-gradient(180deg,#2e8b4c 0 46px,#2a8046 46px 92px)}
.pitch > svg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.prow{position:relative; display:flex; justify-content:space-evenly; align-items:flex-start; padding:4px 0 8px}
.tok{position:relative; flex:0 1 76px; min-width:0; background:none; border:0; padding:0 2px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; -webkit-tap-highlight-color:transparent}
.tok .ph{height:62px; width:100%; display:flex; align-items:flex-end; justify-content:center}
.tok img{max-width:50px; max-height:62px; object-fit:contain; filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.tok .ini{width:42px; height:42px; margin-bottom:6px; border-radius:50%; background:#E8EFEA; color:#0F3A25;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px}
.tok .nm{width:100%; background:#0D2619; color:#fff; font-size:11px; font-weight:600; line-height:1.35; padding:1px 3px;
  border-radius:4px 4px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center}
.tok .vl{width:100%; background:#fff; color:#0D2619; font-size:13px; font-weight:800; line-height:1.35; padding:1px 3px;
  border-radius:0 0 4px 4px; text-align:center; white-space:nowrap}
.tok .vl.proj{font-weight:500; font-style:italic; color:#4A5A51}
.tok .vl.live::after{content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:#D23B2E; margin-left:3px; vertical-align:middle}
.tok .fx{font-size:9.5px; line-height:1.3; color:rgba(255,255,255,.92); margin-top:2px; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tok .bd{position:absolute; top:2px; right:4px; font-size:9px; font-weight:800; letter-spacing:.02em; padding:1px 3px; border-radius:3px; background:#fff; line-height:1.2}
.tok .bd.i{color:#B23A3A} .tok .bd.d{color:#8A6D1E} .tok .bd.in{color:#13824F} .tok .bd.out{color:#5E6B63}
.tok .bn{position:absolute; top:2px; left:4px; font-size:9.5px; font-weight:800; color:#fff; background:rgba(0,0,0,.35); border-radius:3px; padding:0 4px; line-height:1.4}
.tok.sel .nm{background:#F4F7F2; color:#0D2619}
.tok.dim .ph, .tok.dim .nm, .tok.dim .vl{opacity:.5}
.tok:focus-visible{outline:2px solid #fff; outline-offset:2px; border-radius:6px}
.bench{background:#1E5C37; border-radius:0 0 12px 12px; padding:6px 4px 8px; border-top:2px solid rgba(255,255,255,.25)}
.blab{font-size:10.5px; font-weight:700; color:rgba(255,255,255,.75); padding:0 8px 2px}

/* tapped player */
.pcard{background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:12px 14px; margin-top:10px;
  display:grid; grid-template-columns:auto 1fr auto; gap:4px 12px; align-items:center}
.pcard .pp{width:44px; height:56px; display:flex; align-items:flex-end; justify-content:center}
.pcard .pp img{max-width:44px; max-height:56px; object-fit:contain}
.pcard .pn{font-weight:700; font-size:15px}
.pcard .pf{font-size:12px; color:var(--muted)}
.pcard .big{font-weight:800; font-size:24px; text-align:right}
.pcard .big.proj{font-weight:500; font-style:italic; color:var(--muted); font-size:20px}
.bx{grid-column:1/-1; font-size:12.5px; color:var(--muted); padding-top:6px; display:flex; flex-wrap:wrap; gap:4px 12px}
.bx b{color:var(--ink); font-weight:600}
.bx .nw{flex-basis:100%; color:var(--loss)}
@media (max-width:380px){ .tok .ph{height:54px} .tok img{max-width:44px; max-height:54px} .tok .nm{font-size:10.5px} }

/* table */
table{width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--rule); border-radius:10px; overflow:hidden; font-size:14px}
th,td{padding:10px 8px; border-bottom:1px solid var(--rule); text-align:right; white-space:nowrap}
th{font-size:11px; letter-spacing:.06em; color:var(--muted); font-weight:700; background:var(--tint)}
th:nth-child(2),td:nth-child(2){text-align:left; white-space:normal}
td:first-child,th:first-child{width:28px; text-align:center; color:var(--muted)}
tr:last-child td{border-bottom:0}
tr.mine td{box-shadow:inset 0 0 0 9999px color-mix(in srgb, var(--mine) 8%, transparent)}
tr.mine td:nth-child(2){font-weight:700}
.tmn{font-size:11.5px; color:var(--muted); display:block}
.mv{font-size:11px; margin-left:3px}
.mv.up{color:var(--win)} .mv.dn{color:var(--loss)}
@media (max-width:520px){ .hsm{display:none} th,td{padding:9px 6px} }

/* projections: my team + players board */
.sum{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:0 0 12px}
.sum > *{background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:10px 12px; min-width:0; text-decoration:none; color:inherit}
.sum .k{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.sum .v{font-size:24px; font-weight:800; letter-spacing:-.02em; line-height:1.15}
.sum .s{font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sum .v.up{color:var(--win)}
h2{font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; margin:22px 2px 8px}
.swaps{list-style:none; margin:0 0 12px; padding:0; display:flex; flex-direction:column; gap:6px}
.swaps li{background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:9px 12px; display:grid; grid-template-columns:1fr auto; gap:2px 10px; align-items:center; font-size:14px}
.swaps .gain{font-weight:800; color:var(--win); font-size:16px}
.swaps small{grid-column:1/-1; color:var(--muted); font-size:12px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 8px}
.chips button{background:var(--card); border:1px solid var(--rule); border-radius:99px; padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--brand); border-color:var(--brand); color:var(--brand-ink)}
.chips .gap{flex:0 0 6px}
.q{width:100%; font:inherit; color:inherit; background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:9px 12px; margin:0 0 10px}
.q:focus-visible, .chips button:focus-visible, .pt th button:focus-visible{outline:2px solid var(--brand); outline-offset:1px}
.tw{overflow-x:auto; border-radius:10px}
.pt td, .pt th{padding:8px 6px}
.pt th button{background:none; border:0; padding:0; font:inherit; letter-spacing:inherit; color:inherit; cursor:pointer; font-weight:700}
.pt th[aria-sort] button{color:var(--ink); text-decoration:underline; text-underline-offset:3px}
.pt tbody tr.r{cursor:pointer}
.pt tbody tr.r:hover td{background:var(--tint)}
.pt .nm{font-weight:600}
.pt .sm{display:block; font-size:11px; color:var(--muted); font-weight:400}
.pt td.pj{font-weight:700}
.pt td.pj .sm{font-weight:400}
.pt td.hi{font-weight:800}
.pt tr.out td{opacity:.55}
.tag{display:inline-block; font-size:10px; font-weight:800; letter-spacing:.03em; padding:1px 5px; border-radius:4px; background:var(--tint); color:var(--muted); margin-left:4px; vertical-align:1px}
.tag.me{background:var(--brand); color:var(--brand-ink)}
.tag.free{background:color-mix(in srgb, var(--win) 16%, transparent); color:var(--win)}
.tag.flag{background:color-mix(in srgb, var(--loss) 16%, transparent); color:var(--loss)}
.pt tr.det td{text-align:left; white-space:normal; background:var(--tint); font-size:12.5px; color:var(--muted); padding:10px 12px}
.det b, .pdet b{color:var(--ink); font-weight:600}
.ln{display:block; margin:2px 0}
.ln.nw{color:var(--loss)}
.more{display:block; width:100%; margin-top:10px; background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:10px; font-weight:600; cursor:pointer}
.pdet{background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:12px 14px; margin-top:10px; font-size:12.5px; color:var(--muted)}
.pdet .pn{font-weight:700; font-size:15px; color:var(--ink)}
@media (max-width:520px){ .pt td, .pt th{padding:8px 4px} .pt{font-size:13.5px} .sum{grid-template-columns:1fr 1fr} .sum > :first-child{grid-column:1/-1} .sum .v{font-size:22px} }

.empty{color:var(--muted); padding:30px 0; text-align:center}
footer{font-size:12px; color:var(--muted); padding:0 0 30px}
footer a{color:inherit}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <div class="lg" id="lg">FPL Draft</div>
    <div class="gwrow">
      <button type="button" id="prev" aria-label="Previous gameweek">‹</button>
      <h1 id="gwTitle">Gameweek</h1>
      <span class="pill" id="pill"></span>
      <button type="button" id="next" aria-label="Next gameweek">›</button>
    </div>
    <div class="sub" id="sub"></div>
    <nav class="tabs">
      <a href="#/" id="tabH">My team</a>
      <a href="#/players" id="tabP">Players</a>
      <a href="#/matchups" id="tabM">Matchups</a>
      <a href="#/table" id="tabT">Table</a>
    </nav>
  </div>
</header>
<main class="wrap" id="main"><p class="empty">Loading…</p></main>
<footer class="wrap" id="foot"></footer>
<script>
const TZ = "America/New_York";
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S = {app:null, gw:null, cache:{}, side:{}, sel:null, pj:null,
  f:{pos:"ALL", own:"free", sort:"n3", q:"", n:40, open:null}};

/* ---------- time ---------- */
const fmt = (iso, o) => iso ? new Intl.DateTimeFormat("en-US", Object.assign({timeZone:TZ}, o)).format(new Date(iso)) : "";
const kick = iso => fmt(iso, {weekday:"short", hour:"numeric", minute:"2-digit"});
const stamp = iso => fmt(iso, {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit", timeZoneName:"short"});
function ago(iso){
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if(m < 1) return "just now"; if(m < 60) return m + " min ago";
  const h = Math.round(m/60); return h < 48 ? h + " hr ago" : Math.round(h/24) + " days ago";
}
function until(iso){
  const ms = new Date(iso) - Date.now(); if(ms <= 0) return null;
  const h = Math.floor(ms/3.6e6), m = Math.floor(ms%3.6e6/6e4);
  return h >= 48 ? Math.floor(h/24) + "d " + (h%24) + "h" : h + "h " + m + "m";
}

/* ---------- data ---------- */
async function getJSON(path){
  const v = S.app ? S.app.updated_utc : Date.now();
  const r = await fetch(path + "?v=" + encodeURIComponent(v), {cache:"no-store"});
  if(!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}
async function gwDoc(gw){
  if(!S.cache[gw]) S.cache[gw] = await getJSON("data/gw/" + gw + ".json");
  return S.cache[gw];
}

async function projDoc(){
  if(!S.pj){
    const d = await getJSON("data/proj.json");
    d.by = {}; d.players.forEach(p => { p.n3 = p.proj.reduce((a, b) => a + b, 0); d.by[p.id] = p; });
    S.pj = d;
  }
  return S.pj;
}

/* ---------- scoring ---------- */
// earned = points banked at the pull; proj = earned + expected for what's still to play.
// Bench insurance: a starter who may not play leaves (1 - p) of a slot to the first
// unused bench player of a compatible type, which is how auto-subs actually pay out.
function teamScore(doc, lid){
  const L = doc.lineups[lid]; if(!L) return null;
  const P = id => doc.players[String(id)] || {};
  let earned = 0, proj = 0, varc = 0, left = 0;
  const used = new Set();
  for(const id of L.xi){
    const p = P(id);
    earned += p.pts || 0;
    proj += p.proj || 0;
    if(p.state === "pre" || p.state === "live"){
      if(p.state === "pre") left++;
      const rem = Math.max(0, (p.proj||0) - (p.pts||0));
      varc += 6 + 2.2*rem;
      const miss = p.state === "pre" ? 1 - (p.pp || 0) : 0;
      if(miss > 0.02){
        const isGK = p.p === "GKP";
        const b = L.bench.find(x => !used.has(x) && (P(x).p === "GKP") === isGK && (P(x).state === "pre" || P(x).state === "live" || P(x).m > 0));
        if(b != null){ used.add(b); proj += miss * (P(b).proj || 0); }
      }
    }
  }
  return {earned, proj, sd:Math.sqrt(varc), left};
}
function phi(z){ // normal CDF
  const t = 1/(1+0.2316419*Math.abs(z)), d = 0.3989423*Math.exp(-z*z/2);
  const p = d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return z > 0 ? 1-p : p;
}
function matchView(doc, m){
  const A = teamScore(doc, m.a), B = teamScore(doc, m.b);
  const finished = doc.state === "finished";
  const ea = finished ? m.ap : (A ? Math.round(A.earned) : 0);
  const eb = finished ? m.bp : (B ? Math.round(B.earned) : 0);
  let pa = finished ? ea : (A ? A.proj : 0), pb = finished ? eb : (B ? B.proj : 0);
  let wa;
  if(finished) wa = ea > eb ? 1 : ea < eb ? 0 : .5;
  else { const sd = Math.hypot(A?A.sd:8, B?B.sd:8) || 1; wa = phi((pa-pb)/sd); }
  return {ea, eb, pa, pb, wa, la:A?A.left:0, lb:B?B.left:0};
}

/* ---------- header ---------- */
function header(doc){
  const a = S.app, gws = a.gws;
  $("#lg").textContent = a.league;
  $("#gwTitle").textContent = "Gameweek " + S.gw;
  const pill = $("#pill");
  pill.textContent = S.fixed ? "Projections" : doc ? ({live:"Live", upcoming:"Upcoming", finished:"Final"})[doc.state] : "";
  pill.className = "pill" + (!S.fixed && doc && doc.state === "live" ? " live" : "");
  $("#prev").disabled = S.fixed || S.gw <= gws[0];
  $("#next").disabled = S.fixed || S.gw >= gws[gws.length-1];
  const bits = ["Pulled " + stamp(a.updated_utc) + " (" + ago(a.updated_utc) + ")"];
  if(doc && doc.state === "upcoming" && doc.deadline){
    const u = until(doc.deadline);
    bits.push(u ? "Deadline " + kick(doc.deadline) + " · " + u : "Deadline passed — waiting on next pull");
  }
  $("#sub").innerHTML = bits.map(b => "<span>" + esc(b) + "</span>").join("");
}

/* ---------- views ---------- */
function entry(lid){ return S.app.entries[lid] || {name:"?", manager:""}; }

function renderMatchups(doc){
  const me = S.app.me;
  const ms = S.app.matches.filter(m => m.gw === S.gw)
    .sort((x, y) => (y.a === me || y.b === me) - (x.a === me || x.b === me));
  if(!ms.length){ $("#main").innerHTML = '<p class="empty">No fixtures this gameweek.</p>'; return; }
  let note = "";
  if(doc.state === "upcoming") note = '<p class="note"><b>Upcoming.</b> Scores are projections from each team\'s lineup as last saved — last week\'s XI with this week\'s signings in the replaced player\'s slot. Reorders made since aren\'t public until the deadline. Tap a matchup for the pitch.</p>';
  else if(doc.state === "live") note = '<p class="note">Big number is points banked at the pull, small is the projected final. Tap a matchup for players.</p>';
  $("#main").innerHTML = note + '<div class="mlist">' + ms.map(m => {
    const v = matchView(doc, m), A = entry(m.a), B = entry(m.b);
    const pre = doc.state === "upcoming";
    const mine = m.a === me || m.b === me;
    const big = pre
      ? '<div class="score pre">' + v.pa.toFixed(0) + '<span class="dash">–</span>' + v.pb.toFixed(0) + '</div>'
      : '<div class="score">' + v.ea + '<span class="dash">–</span>' + v.eb + '</div>';
    let meta;
    if(doc.state === "finished"){
      const r = v.ea > v.eb ? ["W","L"] : v.ea < v.eb ? ["L","W"] : ["D","D"];
      meta = '<span class="res ' + r[0] + '">' + r[0] + '</span><span>Final</span><span class="r res ' + r[1] + '">' + r[1] + '</span>';
    } else {
      const left = pre ? "" : (" · " + v.la + " to play");
      const right = pre ? "" : (v.lb + " to play · ");
      meta = '<span>' + (pre ? "" : "Proj " + v.pa.toFixed(0)) + left + '</span>' +
             '<span>' + Math.round(v.wa*100) + '% – ' + Math.round((1-v.wa)*100) + '%</span>' +
             '<span class="r">' + right + (pre ? "" : "Proj " + v.pb.toFixed(0)) + '</span>';
    }
    const bar = doc.state === "finished" ? "" :
      '<div class="wp" aria-hidden="true"><i class="a" style="width:' + (v.wa*100).toFixed(1) + '%"></i><i class="b" style="width:' + ((1-v.wa)*100).toFixed(1) + '%"></i></div>';
    return '<a class="mc' + (mine ? " mine" : "") + '" href="#/m/' + S.gw + '/' + m.a + '-' + m.b + '">' +
      '<div class="mgrid"><div class="side"><div class="tn">' + esc(A.name) + '</div><div class="mn">' + esc(A.manager) + '</div></div>' +
      big + '<div class="side r"><div class="tn">' + esc(B.name) + '</div><div class="mn">' + esc(B.manager) + '</div></div></div>' +
      '<div class="meta">' + meta + '</div>' + bar + '</a>';
  }).join("") + '</div>';
}

function fixtureLine(doc, p){
  if(p.state === "blank") return "No fixture";
  const fx = doc.fixtures.filter(f => p.fx.includes(f.id));
  return fx.map(f => {
    const home = f.home === p.t, opp = home ? f.away : f.home;
    const vs = (home ? "v " : "@ ") + opp;
    if(!f.started) return vs + " " + kick(f.kickoff).replace(":00", "").replace(" PM", "p").replace(" AM", "a");
    const own = home ? f.hs : f.as, them = home ? f.as : f.hs;
    return vs + " " + own + "–" + them + " " + (f.done ? "FT" : f.minutes + "'");
  }).join(", ");
}

/* ---------- pictures: club shirt -> initials ---------- */
const SHIRT = (tc, gk) => "https://fantasy.premierleague.com/dist/img/shirts/standard/shirt_" + tc + (gk ? "_1" : "") + "-66.webp";
function initials(n){
  const w = String(n || "?").split(/[\s.]+/).filter(Boolean);
  return (w.length > 1 ? w[0][0] + w[w.length-1][0] : (w[0] || "?").slice(0, 2)).toUpperCase();
}
// global: called from the img onerror attribute
function imgFail(img){
  const s = img.dataset.shirt;
  if(s && img.getAttribute("src") !== s){ img.src = s; return; }
  const sp = document.createElement("span"); sp.className = "ini"; sp.textContent = img.dataset.ini || "?";
  img.replaceWith(sp);
}
// club shirt (keeper kit for GKs), like the official app; initials if it won't load
function pic(p){
  const shirt = p.tc ? SHIRT(p.tc, p.p === "GKP") : "";
  if(!shirt) return '<span class="ini">' + esc(initials(p.n)) + '</span>';
  return '<img src="' + shirt + '" alt="" referrerpolicy="no-referrer" data-ini="' + esc(initials(p.n)) + '" onerror="imgFail(this)">';

/* what a player's number means right now */
function shown(p){
  if(p.state === "pre" || (p.state === "live" && !p.m)) return {cls:"proj", v:(p.proj || 0).toFixed(1)};
  return {cls: p.state === "live" ? "live" : "", v: String(p.pts) + (p.pb ? "*" : "")};
}
function chance(p){ const m = /(\d+)% chance/.exec(p.news || ""); return m ? m[1] + "%" : "?"; }
function fixShort(doc, p){
  if(p.state === "blank") return "No game";
  const f = doc.fixtures.find(x => (p.fx || []).includes(x.id)); if(!f) return "";
  const home = f.home === p.t, vs = (home ? "v " : "@ ") + (home ? f.away : f.home);
  if(!f.started) return vs + " " + fmt(f.kickoff, {weekday:"short"}) + " " +
    fmt(f.kickoff, {hour:"numeric", minute:"2-digit"}).replace(":00", "").replace(" PM", "p").replace(" AM", "a");
  const own = home ? f.hs : f.as, them = home ? f.as : f.hs;
  return f.done ? vs + " " + own + "–" + them : own + "–" + them + " " + f.minutes + "'";
}

function tok(doc, id, o){
  const p = doc.players[String(id)]; if(!p) return "";
  const s = shown(p);
  let bd = "";
  if(o.out) bd = '<span class="bd out">OUT</span>';

  else if(p.st === "d") bd = '<span class="bd d">' + chance(p) + '</span>';
  const num = o.n != null ? '<span class="bn">' + o.n + '</span>' : "";
  const label = p.n + ", " + p.t + ", " + (s.cls === "proj" ? "projected " : "") + s.v + " points";
  return '<button type="button" class="tok' + (o.sel ? " sel" : "") + (o.out ? " dim" : "") + '" data-id="' + id +

function pitch(doc, lid){
  const L = doc.lineups[lid];
  if(!L) return '<p class="empty">No lineup for this team.</p>';
  const P = id => doc.players[String(id)] || {};
  const subIn = new Set(L.subs.map(s => s[1])), subOut = new Set(L.subs.map(s => s[0]));
  const rows = ["GKP","DEF","MID","FWD"].map(pos => L.xi.filter(id => P(id).p === pos));
  let n = 0;
  const bench = L.bench.map(id => {
    const gk = P(id).p === "GKP";
    return tok(doc, id, {out: subOut.has(id), sel: S.sel === id, n: gk ? "GK" : ++n});
  }).join("");
  return '<div class="pitch">' + LINES +
    rows.map(r => '<div class="prow">' + r.map(id => tok(doc, id, {in: subIn.has(id), sel: S.sel === id})).join("") + '</div>').join("") +
    '</div><div class="bench"><div class="blab">Bench, in sub order</div><div class="prow">' + bench + '</div></div>';

function renderTable(doc){
  const a = S.app, me = a.me;
  const live = doc && doc.state !== "finished";
  // projected outcome of this gameweek's match for each side
  const proj = {};
  if(live){
    a.matches.filter(m => m.gw === S.gw).forEach(m => {
      const v = matchView(doc, m);
      const r = v.wa > .55 ? ["W","L"] : v.wa < .45 ? ["L","W"] : ["D","D"];
      proj[m.a] = {r:r[0], f:v.pa, wa:v.wa}; proj[m.b] = {r:r[1], f:v.pb, wa:1-v.wa};
    });
  }
  const rows = a.standings.map(s => {
    const p = proj[s.lid];
    const add = p ? (p.r === "W" ? 3 : p.r === "D" ? 1 : 0) : 0;
    return Object.assign({}, s, {p, livePts: s.pts + add, livePf: s.pf + (p ? p.f : 0)});
  });
  const liveOrder = [...rows].sort((x, y) => y.livePts - x.livePts || y.livePf - x.livePf);
  const lrank = {}; liveOrder.forEach((r, i) => lrank[r.lid] = i + 1);
  const show = live ? liveOrder : rows;
  const hdr = '<tr><th>#</th><th>Team</th><th>W-D-L</th><th class="hsm">PF</th><th>Pts</th>' + (live ? '<th>GW' + S.gw + '</th><th>Proj</th>' : '') + '</tr>';
  const body = show.map(s => {
    const e = entry(s.lid);
    const rank = live ? lrank[s.lid] : s.rank;
    const mv = live && rank !== s.rank ? '<span class="mv ' + (rank < s.rank ? "up" : "dn") + '">' + (rank < s.rank ? "▲" : "▼") + Math.abs(rank - s.rank) + '</span>' : "";
    return '<tr class="' + (s.lid === me ? "mine" : "") + '"><td>' + rank + mv + '</td><td>' + esc(e.name) + '<span class="tmn">' + esc(e.manager) + '</span></td>' +
      '<td>' + s.w + '-' + s.d + '-' + s.l + '</td><td class="hsm">' + s.pf + '</td><td><b>' + s.pts + '</b></td>' +
      (live ? '<td><span class="res ' + (s.p ? s.p.r : "") + '">' + (s.p ? s.p.r : "–") + '</span> <small>' + (s.p ? Math.round(s.p.wa*100) + "%" : "") + '</small></td><td><b>' + s.livePts + '</b></td>' : '') + '</tr>';
  }).join("");
  const note = live ? '<p class="note"><b>Proj</b> adds this gameweek\'s projected result (W if win chance &gt; 55%, L under 45%, else D) and sorts on it. Official table is the W-D-L and Pts columns.</p>' : "";
  $("#main").innerHTML = note + '<table><thead>' + hdr + '</thead><tbody>' + body + '</tbody></table>';
}

/* ---------- projections: shared bits ---------- */
const f1 = v => (v == null ? "–" : (+v).toFixed(1));
const PARTS = [["app","appearance"],["gls","goals"],["ast","assists"],["cs","clean sheet"],["dc","DEFCON"],["sv","saves"],["bon","bonus"],["gc","goals conceded"],["crd","cards"]];
function flag(p){
  if(["i","s","u","n"].includes(p.st)) return '<span class="tag flag">' + ({i:"INJ", s:"SUS", u:"OUT", n:"OUT"})[p.st] + '</span>';
  if(p.st === "d") return '<span class="tag flag">' + chance(p) + '</span>';
  return "";
}
function ownTag(p){
  if(!p.own) return '<span class="tag free">FREE</span>';
  if(p.own === S.app.me) return '<span class="tag me">YOU</span>';
  return '<span class="tag">' + esc(entry(p.own).short || "?") + '</span>';
}
// everything behind one player's number, in words
function detail(pj, p){
  const g0 = pj.gws[0], out = [];
  const bits = PARTS.filter(([k]) => Math.abs(p.br[k] || 0) >= 0.05)
    .map(([k, w]) => (p.br[k] < 0 ? "− " : "+ ") + Math.abs(p.br[k]).toFixed(1) + " " + w).join(" ").replace(/^\+ /, "");
  out.push('<span class="ln"><b>GW' + g0 + " " + esc(p.opp[0] || "no game") + ": " + f1(p.proj[0]) + "</b>" + (bits ? " = " + bits : "") +
    (p.pp < 0.98 ? " (already scaled for a " + Math.round(p.pp*100) + "% chance he plays)" : "") + "</span>");
  (pj.fixtures[g0] || []).filter(f => f.home === p.t || f.away === p.t).forEach(f => {
    const home = f.home === p.t, gf = home ? f.xh : f.xa, ga = home ? f.xa : f.xh;
    out.push('<span class="ln">' + esc(p.t) + " expected goals <b>" + gf.toFixed(2) + "</b> · clean-sheet chance <b>" + Math.round(Math.exp(-ga)*100) +
      "%</b> · from " + (f.xs === "odds" ? "this match's bookmaker odds" : "team ratings built on past odds (this match's odds aren't posted yet)") + "</span>");
  });
  const dc = p.p === "GKP" ? "" : " · DEFCON <b>" + p.dch + "/" + p.n60 + "</b>";
  out.push('<span class="ln">Season: <b>' + p.tot + "</b> pts in " + p.apps + " apps · <b>" + f1(p.p60) + "</b> per full game (" + p.n60 +
    ") · xG+xA <b>" + p.xgi90.toFixed(2) + "</b>/90 · " + p.gi + " goals+assists" + dc + "</span>");
  out.push('<span class="ln">Minutes, last ' + p.l4.length + " gameweeks: <b>" + p.l4.join(", ") + "</b></span>");
  if(p.news) out.push('<span class="ln nw">' + esc(p.news) + "</span>");
  return out.join("");
}
function bestXI(squad){
  const by = pos => squad.filter(p => p.p === pos).sort((a, b) => b.proj[0] - a.proj[0]);
  const G = by("GKP"), D = by("DEF"), M = by("MID"), F = by("FWD");
  let best = null;
  for(let d = 3; d <= 5; d++) for(let m = 2; m <= 5; m++){
    const f = 10 - d - m;
    if(f < 1 || f > 3 || d > D.length || m > M.length || f > F.length) continue;
    const xi = [...D.slice(0, d), ...M.slice(0, m), ...F.slice(0, f)];
    const t = xi.reduce((a, p) => a + p.proj[0], 0);
    if(!best || t > best.t) best = {t, xi};
  }
  if(!best || !G.length) return null;
  const xi = [G[0], ...best.xi], inXI = new Set(xi.map(p => p.id));
  const bench = [...G.slice(1), ...squad.filter(p => p.p !== "GKP" && !inXI.has(p.id)).sort((a, b) => b.proj[0] - a.proj[0])];
  return {xi, bench, total: best.t + G[0].proj[0]};
}
function tokP(p, o){
  const bd = ["i","s","u","n"].includes(p.st) ? '<span class="bd i">' + ({i:"INJ", s:"SUS", u:"OUT", n:"OUT"})[p.st] + '</span>'
    : p.st === "d" ? '<span class="bd d">' + chance(p) + '</span>' : o.mark ? '<span class="bd in">' + o.mark + '</span>' : "";
  const num = o.n != null ? '<span class="bn">' + o.n + '</span>' : "";
  return '<button type="button" class="tok' + (o.sel ? " sel" : "") + '" data-id="' + p.id + '" aria-pressed="' + !!o.sel +
    '" aria-label="' + esc(p.n + ", projected " + f1(p.proj[0]) + " points") + '">' + bd + num +
    '<span class="ph">' + pic(p) + '</span><span class="nm">' + esc(p.n) + '</span>' +
    '<span class="vl proj">' + f1(p.proj[0]) + '</span><span class="fx">' + esc(p.opp[0] || "No game") + '</span></button>';
}

/* ---------- My team ---------- */
function renderTeam(pj, doc){
  const me = S.app.me, g0 = pj.gws[0];
  const squad = pj.players.filter(p => p.own === me);
  const bx = bestXI(squad);
  if(!bx){ $("#main").innerHTML = '<p class="empty">No squad data yet.</p>'; return; }
  // the lineup currently saved, scored with the same projections
  const L = doc && doc.lineups[me], zero = id => pj.by[id] ? pj.by[id].proj[0] : 0;
  const saved = L ? L.xi.reduce((a, id) => a + zero(id), 0) : null;
  const savedSet = new Set(L ? L.xi : []), bestSet = new Set(bx.xi.map(p => p.id));
  const bring = bx.xi.filter(p => L && !savedSet.has(p.id)), drop = L ? L.xi.filter(id => !bestSet.has(id)).map(id => pj.by[id]).filter(Boolean) : [];
  const m = S.app.matches.find(x => x.gw === g0 && (x.a === me || x.b === me));
  let opp = "";
  if(m && doc){
    const o = m.a === me ? m.b : m.a, t = teamScore(doc, o);
    const sd = Math.hypot(8 + 1.2 * bx.total / 4, t ? t.sd : 12) || 1;
    const win = t ? Math.round(phi((bx.total - t.proj) / sd) * 100) : null;
    opp = '<a href="#/m/' + g0 + '/' + m.a + '-' + m.b + '"><div class="k">This week</div><div class="v">' + (win == null ? "–" : win + "%") +
      '</div><div class="s">to beat ' + esc(entry(o).name) + (t ? " (proj " + t.proj.toFixed(0) + ")" : "") + '</div></a>';
  }
  const gain = saved == null ? null : bx.total - saved;
  const sum = '<div class="sum"><div><div class="k">Best XI, GW' + g0 + '</div><div class="v">' + bx.total.toFixed(1) + '</div><div class="s">projected points</div></div>' +
    (saved == null ? "" : '<div><div class="k">Lineup you have saved</div><div class="v' + (gain > 0.3 ? " up" : "") + '">' + saved.toFixed(1) +
      '</div><div class="s">' + (gain > 0.3 ? "+" + gain.toFixed(1) + " available below" : "already the best XI") + '</div></div>') + opp + '</div>';
  let change = "";
  if(bring.length){
    change = '<p class="note"><b>Change from what\'s saved:</b> start ' + bring.map(p => esc(p.n) + " (" + f1(p.proj[0]) + ")").join(", ") +
      " for " + drop.map(p => esc(p.n) + " (" + f1(p.proj[0]) + ")").join(", ") + ".</p>";
  }
  const shape = ["DEF","MID","FWD"].map(x => bx.xi.filter(p => p.p === x).length).join("-");
  const rows = ["GKP","DEF","MID","FWD"].map(pos => bx.xi.filter(p => p.p === pos));
  let n = 0;
  const pitchH = '<div class="ghd"><span>Highest-projected legal XI</span><b>' + shape + '</b></div><div class="pitch">' + LINES +
    rows.map(r => '<div class="prow">' + r.map(p => tokP(p, {sel:S.sel === p.id, mark: L && !savedSet.has(p.id) ? "IN" : ""})).join("") + '</div>').join("") +
    '</div><div class="bench"><div class="blab">Bench, best first</div><div class="prow">' +
    bx.bench.map(p => tokP(p, {sel:S.sel === p.id, n: p.p === "GKP" ? "GK" : ++n})).join("") + '</div></div>';
  const selP = S.sel != null && pj.by[S.sel] && pj.by[S.sel].own === me ? pj.by[S.sel] : null;
  const card = selP ? '<div class="pdet"><div class="pn">' + esc(selP.n) + " · " + esc(selP.t) + " " + selP.p + '</div>' + detail(pj, selP) + '</div>' : "";

  // squad table, next three gameweeks
  const hd = '<tr><th class="hsm"></th><th>Player</th>' + pj.gws.map(g => '<th>GW' + g + '</th>').join("") + '<th>Next ' + pj.gws.length + '</th><th>Avg</th></tr>';
  const order = {GKP:0, DEF:1, MID:2, FWD:3};
  const body = [...squad].sort((a, b) => order[a.p] - order[b.p] || b.n3 - a.n3).map(p =>
    '<tr class="r' + (p.pp < 0.5 ? " out" : "") + '" data-id="' + p.id + '"><td class="hsm">' + p.p + '</td><td><span class="nm">' + esc(p.n) + '</span>' + flag(p) +
    '<span class="sm">' + esc(p.t) + " " + p.p + (bestSet.has(p.id) ? " · starts" : " · bench") + '</span></td>' +
    p.proj.map((v, i) => '<td class="pj">' + f1(v) + '<span class="sm">' + esc(p.opp[i] || "–") + '</span></td>').join("") +
    '<td class="hi">' + f1(p.n3) + '</td><td>' + f1(p.p60) + '</td></tr>').join("");

  // free agents who out-project the weakest player you have in that position
  const ups = [];
  ["GKP","DEF","MID","FWD"].forEach(pos => {
    const mine = squad.filter(p => p.p === pos).sort((a, b) => a.n3 - b.n3);
    if(!mine.length) return;
    const worst = mine[0];
    pj.players.filter(p => !p.own && p.p === pos && p.pp >= 0.75 && p.n60 >= 3 && p.n3 - worst.n3 >= 0.8)
      .sort((a, b) => b.n3 - a.n3).slice(0, 3).forEach(p => ups.push({p, worst, gain: p.n3 - worst.n3}));
  });
  ups.sort((a, b) => b.gain - a.gain);
  const upH = ups.length ? '<ul class="swaps">' + ups.slice(0, 8).map(u =>
    '<li><span><b>' + esc(u.p.n) + '</b> <span class="tag free">FREE</span> for ' + esc(u.worst.n) + '</span><span class="gain">+' + u.gain.toFixed(1) + '</span>' +
    '<small>' + esc(u.p.t) + " " + u.p.p + " · next " + pj.gws.length + ": " + f1(u.p.n3) + " vs " + f1(u.worst.n3) + " · per full game: " + f1(u.p.p60) + " vs " + f1(u.worst.p60) +
    " · " + esc(u.p.opp.join(", ")) + '</small></li>').join("") + '</ul>'
    : '<p class="note">No free agent out-projects anyone in your squad by a meaningful margin.</p>';

  $("#main").innerHTML = sum + change + pitchH + card +
    '<h2>Squad, next ' + pj.gws.length + ' gameweeks</h2><div class="tw"><table class="pt"><thead>' + hd + '</thead><tbody>' + body + '</tbody></table></div>' +
    '<p class="note" style="margin-top:8px"><b>Avg</b> is actual points per full game (60+ minutes) this season. When it sits well above or below the projection, the model and the season disagree — tap the player to see why.</p>' +
    '<h2>Free agents who project higher</h2><p class="note">Compared with your lowest-projected player in the same position over the next ' + pj.gws.length +
    ' gameweeks. Claims you already have pending aren\'t reflected. Full list under <a href="#/players">Players</a>.</p>' + upH;
  const pick = id => { S.sel = S.sel === id ? null : id; renderTeam(pj, doc);
    if(S.sel != null){ const c = $("#main .pdet"); if(c) c.scrollIntoView({block:"nearest", behavior:"smooth"}); } };
  $("#main").querySelectorAll(".tok, tr.r").forEach(el => el.addEventListener("click", () => pick(+el.dataset.id)));
}

/* ---------- Players board ---------- */
const SORTS = {g0:["GW", p => p.proj[0]], n3:["Next 3", p => p.n3], p60:["Avg", p => p.p60 == null ? -1 : p.p60], xgi:["xG+xA/90", p => p.xgi90], tot:["Pts", p => p.tot]};
function renderPlayers(pj){
  const F = S.f, q = F.q.trim().toLowerCase();
  let list = pj.players.filter(p =>
    (F.pos === "ALL" || p.p === F.pos) &&
    (F.own === "all" || (F.own === "free" && !p.own) || (F.own === "mine" && p.own === S.app.me) || (F.own === "taken" && p.own && p.own !== S.app.me)) &&
    (!q || p.n.toLowerCase().includes(q) || (p.t || "").toLowerCase().includes(q)));
  // a rate from one or two games isn't a ranking
  if(F.sort === "p60" || F.sort === "xgi") list = list.filter(p => p.n60 >= 3);
  const key = SORTS[F.sort][1];
  list.sort((a, b) => key(b) - key(a));
  const chip = (grp, val, label) => '<button type="button" data-g="' + grp + '" data-v="' + val + '" aria-pressed="' + (F[grp] === val) + '">' + label + '</button>';
  const th = (k, label) => '<th' + (F.sort === k ? ' aria-sort="descending"' : "") + '><button type="button" data-sort="' + k + '">' + label + '</button></th>';
  const hd = '<tr><th>#</th><th>Player</th>' + th("g0", "GW" + pj.gws[0]) + th("n3", "Next " + pj.gws.length) + th("p60", "Avg") + th("xgi", "xG+xA") + '<th class="hsm">' + th("tot", "Pts").replace(/<\/?th[^>]*>/g, "") + '</th></tr>';
  const body = list.slice(0, F.n).map((p, i) =>
    '<tr class="r' + (p.pp < 0.5 ? " out" : "") + '" data-id="' + p.id + '"><td>' + (i + 1) + '</td><td><span class="nm">' + esc(p.n) + '</span>' + ownTag(p) + flag(p) +
    '<span class="sm">' + esc(p.t) + " " + p.p + " · " + esc(p.opp[0] || "no game") + '</span></td>' +
    '<td class="pj' + (F.sort === "g0" ? " hi" : "") + '">' + f1(p.proj[0]) + '</td><td class="pj' + (F.sort === "n3" ? " hi" : "") + '">' + f1(p.n3) + '</td>' +
    '<td>' + f1(p.p60) + '</td><td>' + p.xgi90.toFixed(2) + '</td><td class="hsm">' + p.tot + '</td></tr>' +
    (F.open === p.id ? '<tr class="det"><td colspan="7">' + detail(pj, p) + '</td></tr>' : "")).join("");
  $("#main").innerHTML =
    '<div class="chips" role="group" aria-label="Filters">' + chip("own", "free", "Free agents") + chip("own", "mine", "Mine") + chip("own", "taken", "Other teams") + chip("own", "all", "Everyone") +
    '<span class="gap"></span>' + ["ALL","GKP","DEF","MID","FWD"].map(x => chip("pos", x, x === "ALL" ? "All positions" : x)).join("") + '</div>' +
    '<input class="q" id="q" type="search" placeholder="Search player or club" aria-label="Search player or club" value="' + esc(F.q) + '">' +
    '<p class="note"><b>GW' + pj.gws[0] + '</b> and <b>Next ' + pj.gws.length + '</b> are projected points. <b>Avg</b> is actual points per full game this season, <b>xG+xA</b> is chance quality per 90. Tap a column to sort, a player for the breakdown.</p>' +
    (list.length ? '<div class="tw"><table class="pt"><thead>' + hd + '</thead><tbody>' + body + '</tbody></table></div>' +
      (list.length > F.n ? '<button type="button" class="more" id="more">Show more (' + (list.length - F.n) + ' left)</button>' : "")
      : '<p class="empty">Nobody matches those filters.</p>');
  const M = $("#main");
  M.querySelectorAll(".chips button").forEach(el => el.addEventListener("click", () => { F[el.dataset.g] = el.dataset.v; F.n = 40; F.open = null; renderPlayers(pj); }));
  M.querySelectorAll("[data-sort]").forEach(el => el.addEventListener("click", () => { F.sort = el.dataset.sort; F.n = 40; renderPlayers(pj); }));
  M.querySelectorAll("tr.r").forEach(el => el.addEventListener("click", () => { const id = +el.dataset.id; F.open = F.open === id ? null : id; renderPlayers(pj); }));
  const more = $("#more"); if(more) more.addEventListener("click", () => { F.n += 40; renderPlayers(pj); });
  const qi = $("#q");
  qi.addEventListener("input", () => { F.q = qi.value; F.n = 40; renderPlayers(pj); const n = $("#q"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); });
}

/* ---------- routing ---------- */
async function route(){
  const h = location.hash.replace(/^#/, "") || "/";
  const mm = h.match(/^\/m\/(\d+)\/(\d+)-(\d+)/);
  const view = mm ? "match" : h.startsWith("/table") ? "table" : h.startsWith("/players") ? "players" : h.startsWith("/matchups") ? "matchups" : "team";
  if(mm) S.gw = +mm[1];
  const tab = {team:"tabH", players:"tabP", matchups:"tabM", match:"tabM", table:"tabT"}[view];
  ["tabH","tabP","tabM","tabT"].forEach(id => $("#" + id).setAttribute("aria-current", id === tab ? "page" : "false"));
  S.fixed = view === "team" || view === "players";
  if(S.fixed){
    let pj = null;
    try { pj = await projDoc(); } catch(e){ /* no projections file yet */ }
    if(pj && pj.gws.length) S.gw = pj.gws[0];
    let doc = null;
    try { doc = await gwDoc(S.gw); } catch(e){}
    header(doc);
    if(!pj || !pj.gws.length){ $("#main").innerHTML = '<p class="empty">No projections yet — they appear after the next data pull.</p>'; return; }
    if(view === "team") renderTeam(pj, doc); else renderPlayers(pj);
    return;
  }
  let doc = null;
  try { doc = await gwDoc(S.gw); } catch(e){ /* missing gw file */ }
  header(doc);
  if(!doc){ $("#main").innerHTML = '<p class="empty">No data for this gameweek yet.</p>'; return; }
  if(view === "table") renderTable(doc);
  else if(mm) renderMatch(doc, mm[2], mm[3]);
  else renderMatchups(doc);
  window.scrollTo({top: mm ? 0 : window.scrollY});
}
function step(d){
  const gws = S.app.gws, i = gws.indexOf(S.gw);
  const n = gws[Math.min(gws.length-1, Math.max(0, i + d))];
  if(n === S.gw) return;
  S.gw = n;
  if(location.hash.startsWith("#/m/")) location.hash = "#/matchups"; else route();
}
$("#prev").addEventListener("click", () => step(-1));
$("#next").addEventListener("click", () => step(1));
window.addEventListener("hashchange", () => { S.sel = null; route(); });

async function boot(){
  try {
    S.app = await (await fetch("data/app.json?t=" + Date.now(), {cache:"no-store"})).json();
  } catch(e){ $("#main").innerHTML = '<p class="empty">Couldn\'t load league data.</p>'; return; }
  if(S.gw == null || !S.app.gws.includes(S.gw)) S.gw = S.app.open_gw;
  $("#foot").innerHTML = 'Projections come from bookmaker odds: each match\'s odds give both teams\' expected goals and clean-sheet chance (before a fixture\'s odds are posted, team ratings fitted to past odds stand in), and each player gets his share — xG/xA share, 60-minute rate, DEFCON rate, saves, bonus — × chance of playing. ' +
    'Odds: football-data.co.uk. Backtested on GW4–9, the top-60 picks scored ~8% more than the old season-average model. ' +
    'They don\'t read team news beyond the injury flag, and they pull every team toward what the betting market expects, so a side on a hot or cold run projects closer to average than its season so far. Data refreshes only when a pull is run by hand, so check the pull time at the top. Club shirts load from the official FPL image servers. ' +
    '<a href="https://github.com/lminutello/fpl-draft-13744">Source</a>';
  route();
}
// poll for a fresh pull; only re-render if the data actually changed
setInterval(async () => {
  if(document.hidden || !S.app) return;
  try {
    const a = await (await fetch("data/app.json?t=" + Date.now(), {cache:"no-store"})).json();
    if(a.updated_utc !== S.app.updated_utc){ S.app = a; S.cache = {}; S.pj = null; route(); }
    else header(S.cache[S.gw]);
  } catch(e){}
}, 90 * 1000);
boot();
</script>
